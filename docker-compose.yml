services:
  backend:
    build: .
    restart: always
    environment:
      DB_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/community?charset=utf8mb4&parseTime=True
      JWT_SECRET: ${JWT_SECRET}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      PORT: "8080"
      UPLOAD_IMG_DIR: ../uploads/images
      UPLOAD_FILE_DIR: ../uploads/files
      TRUSTED_PROXIES: 0.0.0.0/0
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: community
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
