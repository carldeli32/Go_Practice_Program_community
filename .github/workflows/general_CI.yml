name: general_CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]

jobs:

  # ═══════════════════════════════════════════════
  # 阶段一：编译（并行）
  # ═══════════════════════════════════════════════

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build ./...

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ═══════════════════════════════════════════════
  # 阶段二：静态分析
  # ═══════════════════════════════════════════════

  backend-vet:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...

  # ═══════════════════════════════════════════════
  # 阶段三：service 层单元测试
  #   条件：① 编译 + vet 全过 ② 改了 service/data/models
  # ═══════════════════════════════════════════════

  service-test:
    needs: backend-vet
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: community_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: 检查 service 层是否有变更
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - 'service/**'
              - 'data/**'
              - 'models/**'
              - 'go.mod'
              - 'go.sum'

      - uses: actions/setup-go@v5
        if: steps.filter.outputs.service == 'true'
        with:
          go-version: '1.23'

      - name: 等待 MySQL 就绪
        if: steps.filter.outputs.service == 'true'
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -ptest123 --silent; then
              echo "MySQL 已就绪"
              break
            fi
            echo "等待 MySQL... $i/30"
            sleep 2
          done

      - name: 运行 service 单元测试
        if: steps.filter.outputs.service == 'true'
        run: go test ./service/ -v -cover -count=1
        env:
          DB_DSN: root:test123@tcp(127.0.0.1:3306)/community_test?charset=utf8mb4&parseTime=True

      - name: 跳过（无 service 变更）
        if: steps.filter.outputs.service != 'true'
        run: echo "⏭️ 本次提交未修改 service/data/models，跳过测试"
