name: general_CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]

jobs:

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - run: go build ./...
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-vet:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend

  service-test:
    needs: backend-vet
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: community_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: 检查 service 层是否有变更
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - 'backend/service/**'
              - 'backend/data/**'
              - 'backend/models/**'
              - 'backend/go.mod'
              - 'backend/go.sum'

      - uses: actions/setup-go@v6
        if: steps.filter.outputs.service == 'true'
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: 等待 MySQL 就绪
        if: steps.filter.outputs.service == 'true'
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -ptest123 --silent; then
              echo "MySQL 已就绪"
              break
            fi
            echo "等待 MySQL... $i/30"
            sleep 2
          done

      - name: 运行 service 单元测试
        if: steps.filter.outputs.service == 'true'
        run: go test ./service/ -v -cover -count=1
        working-directory: backend
        env:
          DB_DSN: root:test123@tcp(127.0.0.1:3306)/community_test?charset=utf8mb4&parseTime=True

      - name: 跳过（无 service 变更）
        if: steps.filter.outputs.service != 'true'
        run: echo "⏭️ 本次提交未修改 service/data/models，跳过测试"
