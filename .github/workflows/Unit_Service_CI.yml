name: Unit_Service_CI

# ═══════════════════════════════════════════════
# 触发条件：Basic_CI 跑完 → 且全部通过 → 自动触发
# 不绑定 push，不和 Basic_CI 抢资源
# ═══════════════════════════════════════════════

on:
  workflow_run:
    workflows: [Basic_CI]
    types: [completed]

jobs:

  service-test:
    # 只有 Basic_CI 全部通过才跑
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: community_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -ptest123 --silent; then
              echo "MySQL 已就绪"
              break
            fi
            echo "等待 MySQL... $i/30"
            sleep 2
          done

      - name: 运行 service 单元测试
        run: go test ./service/ -v -cover -count=1
        env:
          DB_DSN: root:test123@tcp(127.0.0.1:3306)/community_test?charset=utf8mb4&parseTime=True
